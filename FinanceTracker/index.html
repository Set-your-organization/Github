<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Finance Tracker</h1>
  </header>

  <main class="container">
    <section class="summary" aria-label="Summary">
      <div class="card">
        <h2>Balance</h2>
        <p id="balance" class="amount">$0.00</p>
      </div>
      <div class="card income">
        <h2>Income</h2>
        <p id="total-income" class="amount">$0.00</p>
      </div>
      <div class="card expense">
        <h2>Expenses</h2>
        <p id="total-expense" class="amount">$0.00</p>
      </div>
    </section>

    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add transaction</h2>
      <form id="tx-form" novalidate>
        <div class="field">
          <label for="description">Description</label>
          <input id="description" type="text" maxlength="80" required>
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" type="number" min="0.01" step="0.01" required>
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Housing</option>
            <option>Bills</option>
            <option>Shopping</option>
            <option>Entertainment</option>
            <option>Salary</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input id="date" type="date" required>
        </div>
        <p id="form-error" class="error" role="alert"></p>
        <button type="submit" class="button">Add</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading">Transactions</h2>
        <label for="filter" class="visually-hidden">Filter</label>
        <select id="filter">
          <option value="all">All</option>
          <option value="income">Income</option>
          <option value="expense">Expenses</option>
        </select>
      </div>
      <ul id="tx-list" class="tx-list"></ul>
      <p id="empty" class="empty">No transactions yet.</p>
    </section>

    <section class="panel" aria-labelledby="cat-heading">
      <h2 id="cat-heading">Spending by category</h2>
      <ul id="cat-list" class="cat-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
