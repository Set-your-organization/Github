<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Keep track of your spending effortlessly</p>
    </header>

    <main class="dashboard">
      <!-- Total Summary Card -->
      <section class="summary-card" aria-label="Expenses Overview">
        <div class="summary-item">
          <span class="summary-label">Total Expenses</span>
          <span id="total-amount" class="summary-value">$0.00</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Total Transactions</span>
          <span id="total-count" class="summary-count">0 items</span>
        </div>
      </section>

      <!-- Add Expense Form -->
      <section class="card form-card">
        <h2>Add Expense</h2>
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="expense-title">Title / Description</label>
            <input
              type="text"
              id="expense-title"
              name="title"
              placeholder="e.g., Grocery shopping"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expense-amount">Amount ($)</label>
              <input
                type="number"
                id="expense-amount"
                name="amount"
                placeholder="0.00"
                min="0.01"
                step="0.01"
                required
              />
            </div>

            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category" name="category" required>
                <option value="" disabled selected>Select category</option>
                <option value="Food & Dining">Food &amp; Dining</option>
                <option value="Groceries">Groceries</option>
                <option value="Transportation">Transportation</option>
                <option value="Housing & Utilities">Housing &amp; Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Personal Care">Personal Care</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="expense-date">Date</label>
            <input type="date" id="expense-date" name="date" required />
          </div>

          <div id="form-error" class="error-message" role="alert" style="display: none;"></div>

          <button type="submit" id="add-btn" class="btn btn-primary">
            <span>Add Expense</span>
          </button>
        </form>
      </section>

      <!-- Category Breakdown & Filters -->
      <section class="card list-card">
        <div class="list-header">
          <h2>Expenses History</h2>
          <div class="filters">
            <label for="filter-category" class="sr-only">Filter by category</label>
            <select id="filter-category">
              <option value="ALL">All Categories</option>
              <option value="Food & Dining">Food &amp; Dining</option>
              <option value="Groceries">Groceries</option>
              <option value="Transportation">Transportation</option>
              <option value="Housing & Utilities">Housing &amp; Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Shopping">Shopping</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Personal Care">Personal Care</option>
              <option value="Other">Other</option>
            </select>
            <button id="clear-all-btn" class="btn btn-outline-danger" title="Clear all stored expenses">
              Clear All
            </button>
          </div>
        </div>

        <div id="empty-state" class="empty-state">
          <p>No expenses added yet. Add your first expense above!</p>
        </div>

        <ul id="expense-list" class="expense-list" aria-live="polite"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
